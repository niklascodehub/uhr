<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Uhr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#f2f2f2; --card:#171717; --ui:#8a8a8a; --ui-on:#f2f2f2; --ui-bg:#1f1f1f;
}
:root{color-scheme:dark}
:root[data-theme="light"]{
  --bg:#fff; --fg:#111; --card:#ececec; --ui:#777; --ui-on:#111; --ui-bg:#eee;
  color-scheme:light;
}
html{scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;
  font-family:"Manrope","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{position:fixed;inset:0;height:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Bedienelemente */
.bar{position:fixed;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:12px 16px;z-index:10;
  padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
.bar{transition:opacity .5s ease}
.idle .bar{opacity:0;pointer-events:none}
.idle{cursor:none}
.bar.top{top:env(safe-area-inset-top)}
.bar.bottom{bottom:env(safe-area-inset-bottom)}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--ui-bg);border-radius:12px;padding:3px}
button{font:inherit;font-size:15px;color:var(--ui);background:none;border:0;border-radius:10px;
  min-height:40px;padding:0 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--bg);color:var(--ui-on)}
button:focus-visible{outline:2px solid var(--ui-on);outline-offset:2px}
.btn{background:var(--ui-bg);color:var(--ui-on)}
.btn[hidden]{display:none}

.ico{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:currentColor;stroke:none}
button.i{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:0 11px}
.seg button.i{min-width:48px}

/* Einstellungen */
.row{display:flex;align-items:center;justify-content:space-between;gap:28px;font-size:16px;padding:7px 0}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--bg);border:1px solid var(--ui);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--ui);transition:transform .2s,background .2s}
.switch input:checked + span{background:var(--fg);border-color:var(--fg)}
.switch input:checked + span::after{transform:translateX(20px);background:var(--bg)}
.switch input:disabled{cursor:not-allowed}
.switch input:disabled + span{opacity:.45}
.switch input:focus-visible + span{outline:2px solid var(--ui-on);outline-offset:2px}
.hint{font-size:13px;color:var(--ui);margin:6px 0 18px;max-width:280px}
.hint[hidden]{display:none}
.sub{font-size:14px;color:var(--ui);margin:14px 0 8px;padding-top:14px;border-top:1px solid var(--bg)}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.plist .hint{margin:0 0 4px}
.preset{display:flex;gap:6px}
.preset .btn,.save .btn{background:var(--bg)}
.pbtn{flex:1;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;
  background:var(--bg);color:var(--ui-on);border-radius:12px;min-height:44px;padding:0 14px}
.pbtn small{color:var(--ui);font-size:13px}
.pbtn[aria-pressed="true"]{outline:2px solid var(--ui-on);outline-offset:-2px}
.save{display:flex;gap:6px}
.save input{flex:1;min-width:0;font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:12px;
  border:1px solid var(--ui);background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}

/* Anzeige */
#display{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  gap:calc(var(--h) * .12);
  --h:min(var(--hv), calc(100dvh - 150px));
  --f:min(var(--fv), calc(100dvh - 150px))}
/* Groesse je nach Anzahl sichtbarer Einheiten */
body{--hv:19vw;--fv:20vw;--rows:3.3}
body.u2{--hv:28vw;--fv:31vw;--rows:2.2}
body.u1{--hv:55vw;--fv:55vw;--rows:1.1}
.grp.off,.sep.off{display:none}
.grp{display:flex;gap:calc(var(--h) * .06)}
.sep{width:calc(var(--h) * .1);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--h) * .22);align-items:center}
.sep i{display:block;width:calc(var(--h) * .07);height:calc(var(--h) * .07);border-radius:50%;background:var(--fg);opacity:.85}
.digit{position:relative}

/* Minimal */
.plain .digit{width:calc(var(--f) * .64)}
.plain .txt{font-size:var(--f);line-height:1;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.plain .card{display:none}
.plain .grp{gap:0}
.plain #display{gap:calc(var(--f) * .06)}
.plain .sep{width:calc(var(--f) * .16);gap:calc(var(--f) * .2)}
.plain .sep i{width:calc(var(--f) * .07);height:calc(var(--f) * .07)}

/* Flip */
.flip .txt{display:none}
.card{position:relative;width:calc(var(--h) * .72);height:var(--h);perspective:calc(var(--h) * 4)}
.half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:var(--card);
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.half span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--h) * .72);font-weight:800;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.top{top:0;border-radius:calc(var(--h) * .07) calc(var(--h) * .07) 0 0}
.top span{top:0}
.bot{bottom:0;border-radius:0 0 calc(var(--h) * .07) calc(var(--h) * .07)}
.bot span{bottom:0}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--h) * .015);
  background:var(--bg);transform:translateY(-50%);z-index:6}
.ftop{z-index:4;transform-origin:50% 100%;animation:ft .28s ease-in forwards}
.fbot{z-index:3;transform-origin:50% 0;transform:rotateX(90deg);animation:fb .28s ease-out .28s forwards}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}

/* Doppelpunkte aus (nur Flip-Stil) */
.flip.nocolons .sep{display:none}

/* Timer fertig */
.done #display{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}

/* Hochkant: drei Zeilen */
@media (orientation:portrait){
  #display{flex-direction:column;
    --h:min(calc((100dvh - 170px) / var(--rows)), 58vw);
    --f:min(calc((100dvh - 170px) / var(--rows)), 60vw)}
  .sep{display:none}
  .plain #display{gap:0}
}
@media (prefers-reduced-motion:reduce){.ftop,.fbot{animation:none}}

/* Dialog */
dialog{border:0;border-radius:18px;padding:22px;background:var(--ui-bg);color:var(--ui-on);max-width:92vw;max-height:90dvh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.fields{display:flex;gap:12px;margin:0 0 18px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ui)}
.fields input{width:84px;font:inherit;font-size:28px;text-align:center;padding:8px;border-radius:12px;
  border:1px solid var(--ui);background:var(--bg);color:var(--fg)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
</style>
</head>
<body class="flip">

<div class="bar top">
  <div class="group">
    <div class="seg" id="styleSeg" role="group" aria-label="Darstellung">
      <button class="i" data-style="flip" aria-label="Flip-Stil" title="Flip-Stil"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="2" y1="9" x2="2" y2="15"/><line x1="22" y1="9" x2="22" y2="15"/></svg></button>
      <button class="i" data-style="plain" aria-label="Minimal-Stil" title="Minimal-Stil"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="7" y1="6" x2="7" y2="18"/><rect x="12" y="6" width="6" height="12" rx="3"/></svg></button>
    </div>
    <div class="seg" id="themeSeg" role="group" aria-label="Farbschema">
      <button data-theme="light">Hell</button>
      <button data-theme="dark">Dunkel</button>
    </div>
  </div>
  <button class="btn i" id="cfgBtn" aria-label="Einstellungen" title="Einstellungen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>

<main id="display" aria-live="off"></main>

<div class="bar bottom">
  <div class="seg" id="modeSeg" role="group" aria-label="Funktion">
    <button class="i" data-mode="clock" aria-label="Uhr" title="Uhr"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><polyline points="12 6.5 12 12 15.5 14"/></svg></button>
    <button class="i" data-mode="timer" aria-label="Timer" title="Timer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2v4a5 5 0 0 0 2 4l3 2-3 2a5 5 0 0 0-2 4v4M17 2v4a5 5 0 0 1-2 4l-3 2 3 2a5 5 0 0 1 2 4v4"/></svg></button>
    <button class="i" data-mode="stopwatch" aria-label="Stoppuhr" title="Stoppuhr"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="8"/><path d="M12 14l3-3M10 2h4M12 2v4"/></svg></button>
  </div>
  <div class="group">
    <button class="btn i" id="startBtn" aria-label="Start" title="Start" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polygon class="f" points="7 4 20 12 7 20 7 4"/></svg></button>
    <button class="btn i" id="resetBtn" aria-label="Zurücksetzen" title="Zurücksetzen" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <button class="btn i" id="setBtn" aria-label="Timer einstellen" title="Timer einstellen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="fields">
      <label>Std<input id="inH" type="number" inputmode="numeric" min="0" max="99" value="0"></label>
      <label>Min<input id="inM" type="number" inputmode="numeric" min="0" max="59" value="5"></label>
      <label>Sek<input id="inS" type="number" inputmode="numeric" min="0" max="59" value="0"></label>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="cancel">Abbrechen</button>
      <button type="submit" class="btn" id="apply">Übernehmen</button>
    </div>
  </form>
</dialog>

<dialog id="cfgDlg">
  <form method="dialog">
    <label class="row">Doppelpunkte anzeigen
      <span class="switch"><input type="checkbox" id="colonsChk"><span></span></span>
    </label>
    <p class="hint" id="colonsHint" hidden>Im Minimal-Stil sind die Doppelpunkte immer sichtbar.</p>
    <label class="row">Stunden anzeigen
      <span class="switch"><input type="checkbox" id="unitH"><span></span></span>
    </label>
    <label class="row">Minuten anzeigen
      <span class="switch"><input type="checkbox" id="unitM"><span></span></span>
    </label>
    <label class="row">Sekunden anzeigen
      <span class="switch"><input type="checkbox" id="unitS"><span></span></span>
    </label>
    <div class="sub">Voreinstellungen</div>
    <div class="plist" id="presetList"></div>
    <div class="save">
      <input id="presetName" type="text" maxlength="20" placeholder="Name" aria-label="Name der Voreinstellung" autocomplete="off">
      <button type="button" class="btn i" id="presetSave" aria-label="Aktuelle Anzeige speichern" title="Aktuelle Anzeige speichern"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="actions"><button type="submit" class="btn">Fertig</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try { return localStorage.getItem(k) ?? d } catch { return d } },
    set(k, v){ try { localStorage.setItem(k, v) } catch {} }
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Zustand ---------- */
  let style = store.get('style', 'flip');
  let theme = store.get('theme', 'dark');
  let mode  = store.get('mode', 'clock');
  let colons = store.get('colons', '1') !== '0';
  const loadJSON = k => { try { return JSON.parse(store.get(k, 'null')); } catch { return null; } };
  let units = loadJSON('units');
  units = units && typeof units === 'object'
    ? { h: units.h !== false, m: units.m !== false, s: units.s !== false }
    : { h: true, m: true, s: true };
  if (!units.h && !units.m && !units.s) units.s = true;
  let presets = loadJSON('presets');
  presets = (Array.isArray(presets) ? presets : [])
    .filter(p => p && typeof p.name === 'string' && p.units)
    .map(p => ({ name: p.name.slice(0, 20), units: { h: !!p.units.h, m: !!p.units.m, s: !!p.units.s }, colons: p.colons !== false }));
  const ICON_PLAY = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polygon class="f" points="7 4 20 12 7 20 7 4"/></svg>';
  const ICON_PAUSE = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="6" y="4" width="4" height="16" rx="1"/><rect class="f" x="14" y="4" width="4" height="16" rx="1"/></svg>';
  const timer = { dur: Number(store.get('timerDur', 300000)), left: 0, running: false, end: 0 };
  timer.left = timer.dur;
  const sw = { elapsed: 0, running: false, start: 0 };

  /* ---------- Ziffern ---------- */
  function makeDigit(){
    const el = document.createElement('div');
    el.className = 'digit';
    el.innerHTML = '<div class="txt"></div><div class="card">' +
      '<div class="half top"><span></span></div><div class="half bot"><span></span></div></div>';
    el.v = null; el.t = null;
    return el;
  }
  const $top = el => el.querySelector('.top span');
  const $bot = el => el.querySelector('.bot span');

  function setDigit(el, v){
    if (el.v === v) return;
    const old = el.v;
    el.v = v;
    el.querySelector('.txt').textContent = v;
    clearTimeout(el.t);
    el.querySelectorAll('.flap').forEach(f => f.remove());
    if (old !== null) $bot(el).textContent = old;
    $top(el).textContent = v;
    if (old === null || style !== 'flip' || reduceMotion){
      $bot(el).textContent = v;
      return;
    }
    const card = el.querySelector('.card');
    const ft = document.createElement('div');
    ft.className = 'half top flap ftop';
    ft.innerHTML = '<span>' + old + '</span>';
    const fb = document.createElement('div');
    fb.className = 'half bot flap fbot';
    fb.innerHTML = '<span>' + v + '</span>';
    card.append(ft, fb);
    el.t = setTimeout(() => {
      $bot(el).textContent = v;
      ft.remove(); fb.remove();
    }, 580);
  }

  const display = $('#display');
  const digits = [], groups = [], seps = [];
  for (let g = 0; g < 3; g++){
    if (g > 0){
      const sep = document.createElement('div');
      sep.className = 'sep'; sep.innerHTML = '<i></i><i></i>';
      display.append(sep); seps[g] = sep;
    }
    const grp = document.createElement('div');
    grp.className = 'grp';
    for (let d = 0; d < 2; d++){ const el = makeDigit(); digits.push(el); grp.append(el); }
    display.append(grp); groups[g] = grp;
  }

  function show(h, m, s){
    const t = [h, m, s].map(n => String(n).padStart(2, '0')).join('');
    for (let i = 0; i < 6; i++) setDigit(digits[i], t[i]);
  }
  function showSeconds(total){
    total = Math.max(0, Math.floor(total));
    let h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60;
    // Ausgeblendete Einheiten werden in die naechstkleinere eingerechnet
    if (!units.h){ m += h * 60; h = 0; }
    if (!units.m){ s += m * 60; m = 0; }
    show(Math.min(99, h), Math.min(99, m), Math.min(99, s));
  }
  function layout(){
    const vis = [units.h, units.m, units.s];
    let any = false;
    vis.forEach((v, g) => {
      groups[g].classList.toggle('off', !v);
      if (seps[g]) seps[g].classList.toggle('off', !(v && any));
      if (v) any = true;
    });
    const n = vis.filter(Boolean).length;
    document.body.classList.toggle('u1', n === 1);
    document.body.classList.toggle('u2', n === 2);
  }

  /* ---------- Hauptschleife ---------- */
  function update(){
    const now = Date.now();
    if (mode === 'clock'){
      const d = new Date();
      show(d.getHours(), d.getMinutes(), d.getSeconds());
    } else if (mode === 'timer'){
      if (timer.running){
        timer.left = Math.max(0, timer.end - now);
        if (timer.left === 0) finish();
      }
      showSeconds(Math.ceil(timer.left / 1000));
    } else {
      const ms = sw.running ? sw.elapsed + now - sw.start : sw.elapsed;
      showSeconds(ms / 1000);
    }
  }
  setInterval(update, 100);

  /* ---------- Timer-Ende ---------- */
  let audio = null;
  function beep(){
    if (!audio) return;
    for (let i = 0; i < 3; i++){
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime + i * 0.45;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    }
  }
  function finish(){
    timer.running = false; timer.left = 0;
    document.body.classList.add('done');
    beep();
    if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]);
    refreshButtons();
  }
  const clearDone = () => document.body.classList.remove('done');

  /* ---------- Bildschirm an lassen ---------- */
  let lock = null;
  async function keepAwake(){
    try { if ('wakeLock' in navigator && !lock) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  addEventListener('pointerdown', keepAwake);
  addEventListener('load', keepAwake);
  keepAwake();

  /* ---------- Bedienelemente nach Inaktivität ausblenden ---------- */
  const IDLE_MS = 10000;
  let idleTimer = null;
  function wake(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!document.querySelector('dialog[open]')) document.body.classList.add('idle');
      else wake();
    }, IDLE_MS);
  }
  ['pointerdown', 'pointermove', 'touchstart', 'keydown'].forEach(ev =>
    addEventListener(ev, wake, { passive: true }));
  wake();

  /* ---------- UI ---------- */
  function refreshButtons(){
    document.body.classList.toggle('flip', style === 'flip');
    document.body.classList.toggle('plain', style === 'plain');
    document.body.classList.toggle('nocolons', !colons);
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#000000' : '#ffffff';
    document.querySelectorAll('#styleSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === style));
    document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === theme));
    document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
    const running = mode === 'timer' ? timer.running : sw.running;
    $('#startBtn').hidden = mode === 'clock';
    $('#resetBtn').hidden = mode === 'clock';
    $('#setBtn').hidden = mode !== 'timer';
    const sb = $('#startBtn');
    sb.innerHTML = running ? ICON_PAUSE : ICON_PLAY;
    sb.setAttribute('aria-label', running ? 'Pause' : 'Start');
    sb.title = running ? 'Pause' : 'Start';
    refreshSettings();
  }

  $('#styleSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    style = b.dataset.style; store.set('style', style);
    refreshButtons();
    digits.forEach(d => { $bot(d).textContent = d.v; $top(d).textContent = d.v; });
  });
  $('#themeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    theme = b.dataset.theme; store.set('theme', theme); refreshButtons();
  });
  $('#modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode; store.set('mode', mode);
    clearDone(); refreshButtons(); update();
  });

  $('#startBtn').addEventListener('click', () => {
    clearDone();
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (audio && audio.state === 'suspended') audio.resume();
    const now = Date.now();
    if (mode === 'timer'){
      if (timer.running){ timer.left = Math.max(0, timer.end - now); timer.running = false; }
      else {
        if (timer.left <= 0) timer.left = timer.dur;
        if (timer.left <= 0){ openDialog(); return; }
        timer.end = now + timer.left; timer.running = true;
      }
    } else {
      if (sw.running){ sw.elapsed += now - sw.start; sw.running = false; }
      else { sw.start = now; sw.running = true; }
    }
    refreshButtons(); update();
  });

  $('#resetBtn').addEventListener('click', () => {
    clearDone();
    if (mode === 'timer'){ timer.running = false; timer.left = timer.dur; }
    else { sw.running = false; sw.elapsed = 0; }
    refreshButtons(); update();
  });

  /* ---------- Einstellungen ---------- */
  const UNIT_KEYS = ['h', 'm', 's'];
  const UNIT_NAMES = { h: 'Std', m: 'Min', s: 'Sek' };
  const ICON_X = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
  const saveUnits = () => store.set('units', JSON.stringify(units));
  const savePresets = () => store.set('presets', JSON.stringify(presets));
  const summary = p => UNIT_KEYS.filter(k => p.units[k]).map(k => UNIT_NAMES[k]).join(p.colons ? ':' : ' ');
  const sameAsCurrent = p => UNIT_KEYS.every(k => p.units[k] === units[k]) && p.colons === colons;

  function markPresets(){
    document.querySelectorAll('#presetList .pbtn').forEach(b =>
      b.setAttribute('aria-pressed', sameAsCurrent(presets[b.dataset.use])));
  }
  function renderPresets(){
    const list = $('#presetList'); list.textContent = '';
    if (!presets.length){
      const e = document.createElement('p'); e.className = 'hint';
      e.textContent = 'Noch nichts gespeichert. Stelle die Anzeige ein und gib unten einen Namen ein.';
      list.append(e); return;
    }
    presets.forEach((p, i) => {
      const row = document.createElement('div'); row.className = 'preset';
      const use = document.createElement('button'); use.type = 'button'; use.className = 'pbtn'; use.dataset.use = i;
      const nm = document.createElement('span'); nm.textContent = p.name;
      const sm = document.createElement('small'); sm.textContent = summary(p);
      use.append(nm, sm);
      const del = document.createElement('button'); del.type = 'button'; del.className = 'btn i'; del.dataset.del = i;
      del.setAttribute('aria-label', 'Voreinstellung ' + p.name + ' löschen'); del.title = 'Löschen'; del.innerHTML = ICON_X;
      row.append(use, del); list.append(row);
    });
    markPresets();
  }
  function refreshSettings(){
    const plain = style === 'plain';
    $('#colonsChk').checked = colons || plain;
    $('#colonsChk').disabled = plain;
    $('#colonsHint').hidden = !plain;
    const on = UNIT_KEYS.filter(k => units[k]).length;
    UNIT_KEYS.forEach(k => {
      const c = $('#unit' + k.toUpperCase());
      c.checked = units[k]; c.disabled = units[k] && on === 1;
    });
    markPresets();
  }
  function applyDisplay(){ saveUnits(); store.set('colons', colons ? '1' : '0'); layout(); refreshButtons(); update(); }

  $('#cfgBtn').addEventListener('click', () => { renderPresets(); refreshSettings(); $('#cfgDlg').showModal(); });
  $('#colonsChk').addEventListener('change', e => { colons = e.target.checked; applyDisplay(); });
  UNIT_KEYS.forEach(k => $('#unit' + k.toUpperCase()).addEventListener('change', e => {
    units[k] = e.target.checked;
    if (!UNIT_KEYS.some(x => units[x])) units[k] = true;
    applyDisplay();
  }));

  function addPreset(){
    const input = $('#presetName');
    const name = input.value.trim().slice(0, 20) || 'Voreinstellung ' + (presets.length + 1);
    const p = { name, units: { ...units }, colons };
    const i = presets.findIndex(x => x.name === name);
    if (i >= 0) presets[i] = p; else presets.push(p);
    savePresets(); input.value = ''; renderPresets();
  }
  $('#presetSave').addEventListener('click', addPreset);
  $('#presetName').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPreset(); } });
  $('#presetList').addEventListener('click', e => {
    const use = e.target.closest('[data-use]'), del = e.target.closest('[data-del]');
    if (use){
      const p = presets[Number(use.dataset.use)];
      units = { ...p.units }; colons = p.colons; applyDisplay();
    } else if (del){
      presets.splice(Number(del.dataset.del), 1); savePresets(); renderPresets();
    }
  });

  /* ---------- Timer einstellen ---------- */
  const dlg = $('#dlg');
  function openDialog(){
    const s = Math.round(timer.dur / 1000);
    $('#inH').value = Math.floor(s / 3600);
    $('#inM').value = Math.floor(s % 3600 / 60);
    $('#inS').value = s % 60;
    dlg.showModal();
  }
  $('#setBtn').addEventListener('click', openDialog);
  $('#cancel').addEventListener('click', () => dlg.close());
  $('#form').addEventListener('submit', () => {
    const n = (id, max) => Math.min(max, Math.max(0, parseInt($(id).value, 10) || 0));
    const secs = n('#inH', 99) * 3600 + n('#inM', 59) * 60 + n('#inS', 59);
    timer.dur = secs * 1000; timer.left = timer.dur; timer.running = false;
    store.set('timerDur', timer.dur);
    mode = 'timer'; store.set('mode', mode);
    clearDone(); refreshButtons(); update();
  });

  layout();
  refreshButtons();
  update();
})();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
